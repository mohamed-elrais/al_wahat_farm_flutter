name: al_wahat_farm_flutter
description: Worker-first field operations for Al Wahat Farm.
publish_to: none
version: 1.0.1+4

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  connectivity_plus: ^4.0.2
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.3.0
  flutter_localizations:
    sdk: flutter
  go_router: ^13.2.0
  image_picker: ^1.0.8
  intl: 0.18.1
  mobile_scanner: ^4.0.1
  path: ^1.8.3
  path_provider: ^2.1.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.0
  supabase_flutter: ^2.8.4
  uuid: ^4.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/al_wahat_map_data.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 900
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Variable.ttf
          weight: 400
        - asset: assets/fonts/LibreBaskerville-Variable.ttf
          weight: 700
    # The web CanvasKit renderer downloads Roboto from fonts.gstatic.com unless a
    # "Roboto" family is bundled (OFL; see assets/fonts/NOTICE-Roboto.txt).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    # Arabic glyphs (OFL; see assets/fonts/NOTICE-NotoSansArabic.txt).
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
          weight: 700

# Launcher icons are generated from the painter in
# test/golden/app_icon_test.dart (see that file for the regen steps).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F8F4E9"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
