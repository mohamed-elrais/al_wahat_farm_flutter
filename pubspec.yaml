name: al_wahat_farm_flutter
description: Worker-first field operations for Al Wahat Farm.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  connectivity_plus: ^4.0.2
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.3.0
  flutter_localizations:
    sdk: flutter
  go_router: ^13.2.0
  image_picker: ^1.0.8
  intl: 0.18.1
  mobile_scanner: ^4.0.1
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/al_wahat_map_data.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 900
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Variable.ttf
          weight: 400
        - asset: assets/fonts/LibreBaskerville-Variable.ttf
          weight: 700
